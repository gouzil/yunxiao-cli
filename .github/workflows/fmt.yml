name: Format
on:
  pull_request:
  push:
    branches:
      - main
permissions:
  contents: read
jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Run prek
        uses: j178/prek-action@v2
        with:
          extra-args: --all-files
