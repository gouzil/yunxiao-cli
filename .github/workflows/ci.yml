name: CI
on:
  pull_request:
  push:
    branches:
      - main
permissions:
  contents: read
jobs:
  validate:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Setup Python
        if: matrix.os == 'ubuntu-latest'
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Setup Node.js
        if: matrix.os == 'ubuntu-latest'
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check extension fixtures
        if: matrix.os == 'ubuntu-latest'
        run: |
          python -m pip install ruff==0.12.2
          bash -n test/extensions/yunxiao-shell/yunxiao-shell
          ruff check test/extensions/yunxiao-python/yunxiao-python
          node --check test/extensions/yunxiao-node/yunxiao-node
          go vet ./test/extensions/yunxiao-go
          go build -o "$RUNNER_TEMP/yunxiao-go" ./test/extensions/yunxiao-go
      - name: Test
        if: matrix.os != 'ubuntu-latest'
        run: go test ./...
      - name: Test with extension language compatibility
        if: matrix.os == 'ubuntu-latest'
        env:
          YUNXIAO_TEST_EXTENSION_LANGUAGE_COMPATIBILITY: '1'
        run: go test ./...
      - name: Vet
        run: go vet ./...
      - name: Build
        run: go build ./cmd/yunxiao
